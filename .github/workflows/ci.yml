name: CI

on:
  push:
    branches:
      - main
  pull_request: ~
  workflow_dispatch: ~

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build images
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        # Stage repo-root docs into pwa/.content/docs so the prod PWA build
        # (context ./pwa) can render the /guides routes. See sync-docs.mjs.
        name: Stage docs for the PWA build
        run: node pwa/scripts/sync-docs.mjs
      -
        name: Build dev stack (app-php, app-pwa)
        uses: docker/bake-action@v6
        with:
          pull: true
          load: true
          files: |
            compose.yaml
            compose.override.yaml
          set: |
            php.cache-from=type=gha,scope=php-${{github.ref}}
            php.cache-from=type=gha,scope=php-refs/heads/main
            php.cache-to=type=gha,scope=php-${{github.ref}},mode=max
            pwa.cache-from=type=gha,scope=pwa-dev-${{github.ref}}
            pwa.cache-from=type=gha,scope=pwa-dev-refs/heads/main
            pwa.cache-to=type=gha,scope=pwa-dev-${{github.ref}},mode=max
      -
        name: Build E2E stack (app-pwa-prod)
        uses: docker/bake-action@v6
        with:
          load: true
          files: |
            compose.yaml
            compose.e2e.yaml
          set: |
            php.cache-from=type=gha,scope=php-${{github.ref}}
            php.cache-from=type=gha,scope=php-refs/heads/main
            pwa.cache-from=type=gha,scope=pwa-prod-${{github.ref}}
            pwa.cache-from=type=gha,scope=pwa-prod-refs/heads/main
            pwa.cache-to=type=gha,scope=pwa-prod-${{github.ref}},mode=max
      -
        # Save all three images in one tarball, gzipped to keep upload
        # under ~500MB. `docker load` understands the gzip stream.
        name: Save images
        run: docker save app-php app-pwa app-pwa-prod | gzip > /tmp/images.tar.gz
      -
        name: Upload images artifact
        uses: actions/upload-artifact@v7
        with:
          name: docker-images
          path: /tmp/images.tar.gz
          retention-days: 1
          compression-level: 0

  phpunit:
    # Branch protection on `main` requires a status check named "Tests"
    # (legacy name from before this workflow split out per-tool checks).
    # Keeping the workflow job-id `phpunit` for backward search/log
    # familiarity, but the displayed check name has to match the
    # protection rule.
    name: Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Download images artifact
        uses: actions/download-artifact@v8
        with:
          name: docker-images
          path: /tmp
      -
        name: Load images
        run: docker load -i /tmp/images.tar.gz
      -
        name: Start services
        run: docker compose -f compose.yaml -f compose.override.yaml up --wait --no-build
      -
        name: Check HTTP reachability
        run: curl -v --fail-with-body http://localhost
      -
        name: Check API reachability
        run: curl -vk --fail-with-body https://localhost
      -
        name: Check PWA reachability
        run: "curl -vk --fail-with-body -H 'Accept: text/html' https://localhost"
      -
        name: Check Mercure reachability
        run: curl -vkI --fail-with-body https://localhost/.well-known/mercure?topic=test
      -
        name: Create test database
        run: docker compose exec -T php bin/console -e test doctrine:database:create
      -
        name: Run migrations
        run: docker compose exec -T php bin/console -e test doctrine:migrations:migrate --no-interaction
      -
        name: Run PHPUnit (with coverage)
        # PHPUnit's deprecation tracker accumulates context across the whole
        # suite, so peak memory grows with test count. The default 128M was
        # tight even before; 512M then started tipping over as the suite
        # grew, so we run unbounded here — GitHub runners have GBs free and
        # the limit was only ever an accidental ceiling, not a real budget.
        #
        # Coverage rides along on this single run: XDEBUG_MODE=coverage flips
        # the (installed-but-off) Xdebug driver on for this process only, and
        # --coverage-clover writes the report the floor gate reads next. One
        # suite execution covers both the pass/fail signal and the floor.
        run: docker compose exec -T -e XDEBUG_MODE=coverage php php -d memory_limit=-1 bin/phpunit --coverage-clover var/coverage.xml
      -
        name: Enforce coverage floor
        # Fails the build when line coverage of api/src drops below the floor
        # (DataFixtures are excluded from coverage — see phpunit.xml.dist).
        # The floor is a *minimum* regression guard, not a target — ratchet the
        # trailing floor argument up as coverage climbs. Nudged to 83.5 after
        # removing the discussion move/copy controllers (fully covered code +
        # their tests), which shaved the api/src average a hair under 84.
        # Lowered to 81.5 for the SSO + calendar-sync subsystem (#267/#581/#582),
        # then ratcheted back up to 85.0 once that subsystem got real coverage —
        # MockHttpClient wire-format tests for the Google/Microsoft/Stripe clients,
        # stub-provider tests for the SSO + OAuth callback dances, the SSO client
        # factory, a real pg_dump BackupRunner test, and assorted service/entity
        # units. Continue ratcheting toward 90% as the remaining controllers get
        # endpoint tests.
        run: docker compose exec -T php php bin/coverage-check.php var/coverage.xml 85.0
      -
        name: Check the PWA plan matrix is in sync with PlanCatalog
        # The public pricing page is statically built with no API reachable, so
        # it carries a generated copy of the plan entitlement matrix. Regenerate
        # it here and fail on any diff — otherwise a plan change on the server
        # ships a pricing page that advertises the old one. Lives in this job
        # rather than its own so it gates without a branch-protection change.
        run: |
          scripts/gen-plan-matrix.sh
          if ! git diff --quiet -- pwa/lib/planEntitlements.generated.ts; then
            echo "::error file=pwa/lib/planEntitlements.generated.ts::Stale: PlanCatalog changed but the PWA copy wasn't regenerated. Run scripts/gen-plan-matrix.sh and commit the result."
            git --no-pager diff -- pwa/lib/planEntitlements.generated.ts
            exit 1
          fi

  phpstan:
    name: PHPStan
    needs: build
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Download images artifact
        uses: actions/download-artifact@v8
        with:
          name: docker-images
          path: /tmp
      -
        name: Load images
        run: docker load -i /tmp/images.tar.gz
      -
        # Need the php container up so vendor/ is composer-installed into
        # the shared api_vendor volume. Skip PWA — phpstan doesn't need it.
        name: Start services
        run: docker compose -f compose.yaml -f compose.override.yaml up --wait --no-build php database
      -
        name: Run PHPStan
        # The cache:warmup + phpstan analyse pair has to run in a single
        # container: the dev Dockerfile declares `VOLUME /app/var/`, so
        # every `docker compose run --rm` instantiates a fresh anonymous
        # volume on /app/var and the warmup's compiled container XML
        # vanishes between calls. Chaining them via `sh -c` keeps the
        # warmed cache visible to phpstan-symfony's containerXmlPath and
        # phpstan-doctrine's objectManagerLoader.
        #
        # PHPStan exits 0 even when parallel workers crash (the "Result
        # is incomplete" path), so we tee the output and fail manually
        # on that banner — otherwise an analyzer crash would silently
        # let real errors through CI.
        run: |
          set -o pipefail
          docker compose -f compose.yaml -f compose.override.yaml run --rm --entrypoint=sh phpstan -c '
            php -d xdebug.mode=off bin/console -e test cache:warmup &&
            php -d xdebug.mode=off vendor/bin/phpstan analyse --memory-limit=4G --no-progress
          ' 2>&1 | tee /tmp/phpstan.out
          if grep -q "Result is incomplete\|Some parallel worker jobs have not finished" /tmp/phpstan.out; then
            echo "::error::PHPStan analysis was incomplete — failing the build."
            exit 1
          fi

  phpcs:
    name: PHPCS
    needs: build
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Download images artifact
        uses: actions/download-artifact@v8
        with:
          name: docker-images
          path: /tmp
      -
        name: Load images
        run: docker load -i /tmp/images.tar.gz
      -
        # phpcs only needs vendor/ — no database, no PWA.
        name: Start php service
        run: docker compose -f compose.yaml -f compose.override.yaml up --wait --no-build php
      -
        name: Run PHP_CodeSniffer
        run: docker compose -f compose.yaml -f compose.override.yaml run --rm phpcs

  schema:
    name: Doctrine Schema
    needs: build
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Download images artifact
        uses: actions/download-artifact@v8
        with:
          name: docker-images
          path: /tmp
      -
        name: Load images
        run: docker load -i /tmp/images.tar.gz
      -
        name: Start services
        # Skip PWA — schema validation only needs the API + database.
        run: docker compose -f compose.yaml -f compose.override.yaml up --wait --no-build php database
      -
        name: Create test database
        run: docker compose exec -T php bin/console -e test doctrine:database:create
      -
        name: Run migrations
        run: docker compose exec -T php bin/console -e test doctrine:migrations:migrate --no-interaction
      -
        name: Doctrine Schema Validator
        run: docker compose exec -T php bin/console -e test doctrine:schema:validate

  typecheck:
    name: PWA Typecheck
    needs: build
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Download images artifact
        uses: actions/download-artifact@v8
        with:
          name: docker-images
          path: /tmp
      -
        name: Load images
        run: docker load -i /tmp/images.tar.gz
      -
        name: Start PWA
        # Typecheck only needs the PWA container with source mounted.
        run: docker compose -f compose.yaml -f compose.override.yaml up --wait --no-build pwa
      -
        name: PWA typecheck
        # Wait for the dev container's `pnpm install` to finish before
        # invoking tsc — `--wait` only waits for the healthcheck, but
        # `pnpm install` runs after that on first boot. Then run
        # `tsc --noEmit` so type errors fail CI rather than hide behind
        # Next.js's permissive dev server.
        run: |
          docker compose exec -T pwa sh -c 'until [ -d node_modules/typescript ]; do sleep 2; done'
          docker compose exec -T pwa pnpm typecheck
      -
        name: PWA lint
        # ESLint (Next + react-hooks rules) — run in the same job as the
        # typecheck so hook-rule / Next regressions fail CI too. node_modules
        # is already warm from the typecheck step above.
        run: docker compose exec -T pwa pnpm lint
      -
        name: PWA unit tests
        # Vitest over the pure logic in pwa/lib (query parsing, validation
        # mapping, password strength, auth-redirect sanitisation, …).
        # `test:coverage` enforces the minimum-coverage floor declared in
        # pwa/vitest.config.ts over the tested-module allowlist, so a PR
        # that drops a covered branch fails here. Component coverage stays
        # in the e2e suite.
        run: docker compose exec -T pwa pnpm test:coverage

  e2e:
    name: E2E
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Download images artifact
        uses: actions/download-artifact@v8
        with:
          name: docker-images
          path: /tmp
      -
        name: Load images
        run: docker load -i /tmp/images.tar.gz
      -
        name: Start services
        run: docker compose -f compose.yaml -f compose.e2e.yaml up --wait --no-build
      -
        name: Load fixtures
        # Fixture users (admin@madori.test / user@madori.test) are required by
        # several auth and admin E2E tests. Migrations run via the PHP
        # container entrypoint, but fixtures must be loaded explicitly.
        run: docker compose exec -T php bin/console doctrine:fixtures:load --no-interaction
      -
        # Cache Playwright's npm install across runs — keyed on the
        # lockfile so a dependency bump invalidates cleanly.
        name: Cache e2e node_modules
        uses: actions/cache@v6
        with:
          path: e2e/node_modules
          key: e2e-node-modules-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
      -
        name: Playwright
        # Run chromium only in CI for fast feedback — the full firefox/webkit
        # matrix is available locally via `npx playwright test`. `npm ci`
        # (not `npm i`) so a stale lockfile fails CI instead of getting
        # silently upgraded.
        run: docker run --network host -w /app -v ./e2e:/app --rm --ipc=host -e CI=true mcr.microsoft.com/playwright:v1.59.1-noble /bin/sh -c 'npm ci --prefer-offline --no-audit --fund=false; npx playwright test --project=chromium;'

  lint:
    name: Docker Lint
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Lint Dockerfiles
        uses: hadolint/hadolint-action@v3.5.0
        with:
          recursive: true
