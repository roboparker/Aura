version: 2

updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    assignees:
      - roboparker
    open-pull-requests-limit: 10
  - package-ecosystem: composer
    directory: /api
    schedule:
      interval: daily
    labels:
      - dependencies
    assignees:
      - roboparker
    open-pull-requests-limit: 10
    ignore:
      # Symfony components are pinned to 7.2.* in composer.json — bumping a
      # single component to a new major (e.g. dotenv 8.0) desyncs the stack.
      # Major Symfony upgrades must be done together as a coordinated PR.
      - dependency-name: "symfony/*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /pwa
    schedule:
      interval: daily
    labels:
      - dependencies
    assignees:
      - roboparker
    open-pull-requests-limit: 10
    groups:
      # @blocknote/core, /react and /mantine must move in lockstep — the
      # editor types are cross-package, so bumping one alone leaves two
      # copies of @blocknote/core in the tree and fails the PWA typecheck.
      blocknote:
        patterns:
          - "@blocknote/*"
