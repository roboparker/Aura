api_platform:
    title: Hello API Platform
    version: 1.0.0
    # Mercure integration, remove if unwanted
    mercure:
        include_type: true
    # Good defaults for REST APIs
    defaults:
        stateless: false
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
        # Cap client-controlled page size so `?itemsPerPage=100000` can't
        # force a full-table serialization (the Task collection enables
        # pagination_client_items_per_page).
        pagination_maximum_items_per_page: 100
