security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    # NOTE: ROLE_ALLOWED_TO_SWITCH is intentionally NOT granted here.
    # Admin impersonation (switch_user) is authorized per-target by
    # App\Security\ImpersonationVoter, which requires ROLE_ADMIN AND the
    # target user's `canBeImpersonated` opt-in (off by default). Granting
    # the role via role_hierarchy would let the built-in RoleVoter approve
    # the switch and bypass that consent check.

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        # MCP / programmatic API: stateless firewall that authenticates the
        # caller from a personal access token in the Authorization header.
        # Declared before `main` so its pattern wins on the JSON-RPC route
        # before json_login or the 2FA listener get a chance to look at it.
        mcp:
            pattern: ^/mcp
            stateless: true
            provider: app_user_provider
            custom_authenticators:
                - App\Security\ApiTokenAuthenticator
        # API tokens on the REST API. A dedicated STATELESS firewall matched by
        # the `Authorization: Bearer` header (BearerTokenRequestMatcher), so a
        # token authenticates as its owner without ever touching a session —
        # keeping the cookie/json_login/2FA flow on `main` completely separate.
        # Declared before `main` so Bearer requests are claimed here; everything
        # else falls through to `main`. What the token may do is enforced by its
        # AccessPolicy (App\EventListener\AccessPolicyListener).
        api_token:
            request_matcher: App\Security\BearerTokenRequestMatcher
            stateless: true
            provider: app_user_provider
            custom_authenticators:
                - App\Security\ApiTokenAuthenticator
        main:
            lazy: true
            stateless: false
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            # Explicit 401-JSON entry point — this is an API firewall, so
            # unauthenticated access returns 401 (the PWA owns routing to the
            # sign-in page). Social-login (#267) is a controller flow
            # (SsoController) that logs the user in programmatically, so it
            # needs no firewall authenticator here.
            entry_point: App\Security\JsonAuthenticationEntryPoint
            json_login:
                check_path: auth_login
                username_path: email
                password_path: password
                # Default failure behavior (401 + {error}) with one addition:
                # login-throttling hits surface as 429 + Retry-After.
                failure_handler: App\Security\JsonLoginFailureHandler
            # Brute-force throttle on password auth. Counts failed attempts
            # at /auth/login (successes don't consume); the 2FA challenge
            # at /auth/2fa-check has its own `two_factor_verify` limiter.
            # Limits are env-tunable — see the rate_limiter block in
            # framework.yaml and app.login_rate_limiter in services.yaml.
            login_throttling:
                limiter: app.login_rate_limiter
            # SchebTwoFactorBundle: when the password-auth step succeeds and
            # the user has TOTP enabled, swap the token for a TwoFactorToken
            # and route the next POST to /auth/2fa-check through the
            # JSON handlers below.
            two_factor:
                auth_form_path: 2fa_login_check   # POST target (no GET form)
                check_path: 2fa_login_check
                post_only: true
                auth_code_parameter_name: code
                authentication_required_handler: App\Security\TwoFactorJsonHandler
                success_handler: App\Security\TwoFactorJsonHandler
                failure_handler: App\Security\TwoFactorJsonHandler
            logout:
                path: /auth/logout
            # Admin impersonation. Authorized per-target by
            # App\Security\ImpersonationVoter (ROLE_ADMIN + the target's
            # `canBeImpersonated` opt-in). Start by hitting any main-firewall
            # route with ?_switch_user=<email>; stop with ?_switch_user=_exit.
            # The PWA drives both through /api/me so the same request returns
            # the swapped user payload.
            switch_user: true

    access_control:
        - { path: ^/users$, methods: [POST], roles: PUBLIC_ACCESS }
        - { path: ^/auth/login$, roles: PUBLIC_ACCESS }
        - { path: ^/auth/forgot-password$, roles: PUBLIC_ACCESS }
        - { path: ^/auth/reset-password$, roles: PUBLIC_ACCESS }
        # Email confirmation: the clicker holds only the token (no session).
        - { path: ^/verify-email$, methods: [POST], roles: PUBLIC_ACCESS }
        # Deletion restore links. Public by necessity, not convenience: an
        # account inside its deletion grace period cannot sign in, so requiring
        # a session would make the link useless for exactly the case it exists
        # for. The token is the credential and restoring is non-destructive.
        - { path: ^/restore/, roles: PUBLIC_ACCESS }
        # Allow the half-authenticated 2FA token through the check endpoint
        # (and only that endpoint) so users can submit their code.
        - { path: ^/auth/2fa-check$, roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        - { path: ^/auth/change-password$, roles: ROLE_USER }
        # Any authenticated session (including a waitlisted ROLE_WAITLISTED
        # account, which has no ROLE_USER) must read its own profile so the
        # PWA can route it to the /waitlist gate.
        - { path: ^/api/me$, roles: IS_AUTHENTICATED_FULLY }
        # Resend the verification link: reachable by an authenticated but
        # unverified (ROLE_UNVERIFIED) session boxed into the verify gate.
        - { path: ^/me/verification/resend$, methods: [POST], roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/me/2fa, roles: ROLE_USER }
        # Personal-account billing (#billing Phase 1b).
        - { path: ^/me/billing, roles: ROLE_USER }
        - { path: ^/me/sessions, roles: ROLE_USER }
        # Self-service calendar-feed management (reveal/regenerate/revoke).
        # The feed itself (/calendar/feed/{token}.ics) is token-authenticated
        # and stays PUBLIC_ACCESS via the catch-all — calendar clients can't
        # present a session cookie.
        - { path: ^/me/calendar-feed, roles: ROLE_USER }
        # Account lifecycle (GDPR/CCPA): any fully-authenticated account —
        # including a waitlisted ROLE_WAITLISTED one, which holds no ROLE_USER
        # — must be able to deactivate, export, and delete itself. The
        # controller only operates on the current user and every action is
        # step-up protected via SensitiveActionVerifier.
        - { path: ^/me/(deactivate|export|delete)$, roles: IS_AUTHENTICATED_FULLY }
        # Account-export download landing: status + zip for the requester's
        # GDPR export. Reachable by any fully-authenticated account (a
        # waitlisted one too) so the emailed link works while waiting; the
        # controller resolves the token only for the requester.
        - { path: ^/account-exports/, roles: IS_AUTHENTICATED_FULLY }
        # Waitlist mode toggle — platform admins only.
        - { path: ^/admin/waitlist, roles: ROLE_ADMIN }
        # Admin account provisioning (#admin-user-create) — creates a sign-in-ready
        # account, so it's an account-creation vector: platform admins only.
        - { path: ^/admin/users, roles: ROLE_ADMIN }
        # Sentry verification triggers (error/worker) — platform admins only.
        - { path: ^/admin/sentry-test, roles: ROLE_ADMIN }
        - { path: ^/admin/growth, roles: ROLE_ADMIN }
        # SSO admin config (enable toggle, allowed domains, button label).
        # Linking / unlinking a social account to the signed-in user (#267).
        - { path: ^/me/sso, roles: ROLE_USER }
        # OAuth account connections for API access (#581).
        - { path: ^/me/connections, roles: ROLE_USER }
        # Organizations (#billing Phase 1) — the account layer above spaces.
        - { path: ^/organizations, roles: ROLE_USER }
        # Admin-managed SSO provider configuration (#267).
        - { path: ^/admin/sso, roles: ROLE_ADMIN }
        # User segments (A/B tests, beta gating, rollouts) — platform admins
        # only. Covers the ApiResource CRUD and the member/preview controller.
        - { path: ^/segments, roles: ROLE_ADMIN }
        # Global custom fields (#global-custom-fields) — instance-wide,
        # admin-managed. Only create/edit/delete is platform-admin; reads stay
        # open to any authenticated user (ROLE_USER, enforced on the entity) so
        # global fields render in the per-project field picker and on task values.
        - { path: ^/global_custom_field_definitions, methods: [POST, PUT, PATCH, DELETE], roles: ROLE_ADMIN }
        - { path: ^/media-objects, methods: [POST], roles: ROLE_USER }
        - { path: ^/boards/[^/]+/members$, methods: [POST], roles: ROLE_USER }
        - { path: ^/api-tokens, roles: ROLE_USER }
        - { path: ^/mcp, roles: ROLE_USER }
        # Stripe billing webhook: unauthenticated at the firewall (no Bearer,
        # no cookie) — authenticity is proven by the Stripe-Signature HMAC,
        # verified in App\Billing\StripeGateway. The other /spaces/{id}/billing
        # routes fall through to the catch-all and enforce auth in the controller.
        - { path: ^/billing/webhook$, methods: [POST], roles: PUBLIC_ACCESS }
        # Calendar change-notification webhooks (#582 Phase D): unauthenticated
        # at the firewall — authenticity is the per-subscription secret the
        # provider echoes back, verified in CalendarWebhookController.
        - { path: ^/calendar/webhook/, methods: [POST], roles: PUBLIC_ACCESS }
        - { path: ^/docs, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
