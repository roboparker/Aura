# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_hosts: '%env(TRUSTED_HOSTS)%'
    # See https://caddyserver.com/docs/caddyfile/directives/reverse_proxy#headers
    trusted_headers: [ 'x-forwarded-for', 'x-forwarded-proto' ]

    # Session is needed for json_login authentication
    session: true

    # UUIDv7 is time-ordered, which keeps B-tree index locality good.
    # Configured globally so `doctrine.uuid_generator` emits v7.
    uid:
        default_uuid_version: 7
        time_based_uuid_version: 7

    # Per-user throttle on 2FA verification + login challenge attempts so
    # a stolen password can't be brute-forced past TOTP. Limiter is keyed
    # by user id (in-app code), not IP, so concurrent honest sessions on
    # the same network don't lock each other out.
    rate_limiter:
        two_factor_verify:
            policy: 'token_bucket'
            limit: 5
            rate: { interval: '1 minute', amount: 5 }

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
