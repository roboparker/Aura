# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_hosts: '%env(TRUSTED_HOSTS)%'
    # See https://caddyserver.com/docs/caddyfile/directives/reverse_proxy#headers
    trusted_headers: [ 'x-forwarded-for', 'x-forwarded-proto' ]

    # Session is needed for json_login authentication.
    # Cookie hardening: `secure` follows the request scheme (auto), the
    # cookie is invisible to JS, and Lax same-site blocks cross-site POSTs
    # from carrying it. The PWA and API are same-origin behind Caddy, so
    # Lax doesn't affect the auth flow.
    session:
        cookie_secure: auto
        cookie_httponly: true
        cookie_samesite: lax
        # Persist sessions in Postgres (see services.yaml) instead of the
        # container's filesystem, so a deploy / container swap doesn't log
        # everyone out. The store survives because the database does.
        handler_id: Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler

    # UUIDv7 is time-ordered, which keeps B-tree index locality good.
    # Configured globally so `doctrine.uuid_generator` emits v7.
    uid:
        default_uuid_version: 7
        time_based_uuid_version: 7

    # Per-user throttle on 2FA verification + login challenge attempts so
    # a stolen password can't be brute-forced past TOTP. Limiter is keyed
    # by user id (in-app code), not IP, so concurrent honest sessions on
    # the same network don't lock each other out.
    #
    # The abuse limits below guard the three unauthenticated endpoints
    # (login / signup / forgot-password). Sizes are env-tunable so each
    # deployment can adjust without a code change: prod-safe defaults live
    # in api/.env; .env.dev and .env.test relax them so Playwright and the
    # PHPUnit suite (hundreds of signups per run, all from one IP) never
    # trip them. Storage is the default rate-limiter cache pool (backed by
    # cache.app, filesystem) — per-container state, which is fine for the
    # single-container deployment; a multi-replica deployment would need a
    # shared store (e.g. Redis) behind cache.app to throttle globally.
    rate_limiter:
        two_factor_verify:
            policy: 'token_bucket'
            limit: 5
            rate: { interval: '1 minute', amount: 5 }
        # Login brute-force: consumed by app.login_rate_limiter (see
        # services.yaml), wired into the `main` firewall's login_throttling.
        # `login_ip_email` is the per-(IP, email) limit; `login_ip` is the
        # wider per-IP net across all emails. Only *failed* attempts count
        # — the listener peeks at CheckPassport and consumes on failure.
        login_ip_email:
            policy: 'sliding_window'
            limit: '%env(int:RATE_LIMIT_LOGIN_ATTEMPTS)%'
            interval: '15 minutes'
        login_ip:
            policy: 'sliding_window'
            limit: '%env(int:RATE_LIMIT_LOGIN_ATTEMPTS_PER_IP)%'
            interval: '15 minutes'
        # Signup flood (POST /users is PUBLIC_ACCESS): consumed per client
        # IP by UserPasswordHasherProcessor before the user is persisted.
        signup_ip:
            policy: 'sliding_window'
            limit: '%env(int:RATE_LIMIT_SIGNUPS_PER_IP)%'
            interval: '1 hour'
        # Forgot-password: each request mints a reset token and queues an
        # email, so this is also a mail-spam vector. Both limiters are
        # consumed in PasswordController::forgotPassword before the user
        # lookup, so throttling can't leak whether an email is registered.
        forgot_password_ip:
            policy: 'sliding_window'
            limit: '%env(int:RATE_LIMIT_FORGOT_PASSWORD_PER_IP)%'
            interval: '1 hour'
        forgot_password_email:
            policy: 'sliding_window'
            limit: '%env(int:RATE_LIMIT_FORGOT_PASSWORD_PER_EMAIL)%'
            interval: '1 hour'
        # Resend of the email-verification link (authenticated, keyed per
        # user in EmailVerificationController). Each accepted request queues
        # an email, so it doubles as a mail-spam vector at the user's own
        # inbox. Fixed limit (not env-driven) like two_factor_verify.
        email_verification_resend:
            policy: 'token_bucket'
            limit: 5
            rate: { interval: '10 minutes', amount: 5 }

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            # The suite uses in-memory mock storage; null the DB handler so
            # tests never touch the sessions table.
            handler_id: null
            storage_factory_id: session.storage.factory.mock_file
