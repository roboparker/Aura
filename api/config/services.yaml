# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Minimum `Symfony\Component\Validator\Constraints\PasswordStrength` score
    # required for signup, change-password, and reset-password. 0 =
    # VERY_WEAK, 2 = MEDIUM, 4 = VERY_STRONG. Staging + production stay at
    # MEDIUM; dev + test relax to VERY_WEAK (see `when@dev` / `when@test`).
    app.password_min_strength: 2

    # Default signup mode when no `app_setting` row has been written yet
    # (i.e. before any admin has touched the toggle). Ships ON so a fresh
    # prod/staging deploy is locked to the waitlist immediately; dev + test
    # relax to OFF so local signups + the test suite keep working. Once an
    # admin flips the toggle, the DB row wins over this default. Read by
    # App\Service\WaitlistSettings.
    app.waitlist_enabled_default: true

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Doctrine\TaskOwnerExtension:
        tags:
            - { name: api_platform.doctrine.orm.query_extension.collection }
            - { name: api_platform.doctrine.orm.query_extension.item }

    App\Doctrine\TagOwnerExtension:
        tags:
            - { name: api_platform.doctrine.orm.query_extension.collection }
            - { name: api_platform.doctrine.orm.query_extension.item }

    App\Doctrine\ApiTokenAccessExtension:
        tags:
            - { name: api_platform.doctrine.orm.query_extension.collection }
            - { name: api_platform.doctrine.orm.query_extension.item }

    # MCP tool + custom-field-type autoconfiguration: every class
    # implementing the respective interface is tagged so it lands in its
    # registry without per-class wiring. Adding a new MCP tool or a new
    # custom-field-type strategy is then a one-file change.
    _instanceof:
        App\Mcp\Tool\McpToolInterface:
            tags: ['app.mcp_tool']
        App\CustomField\Type\CustomFieldTypeInterface:
            tags: ['app.custom_field_type']

    App\Mcp\McpToolRegistry:
        arguments:
            $tools: !tagged_iterator app.mcp_tool

    App\CustomField\CustomFieldTypeRegistry:
        arguments:
            $types: !tagged_iterator app.custom_field_type

    # Replace stof's default actor provider with one that yields the
    # user's IRI (`/users/{uuid}`) instead of `getUserIdentifier()`
    # (= email). The IRI is stable across email changes and lets the
    # activity controllers resolve the actor back to a User row.
    stof_doctrine_extensions.tool.actor_provider:
        class: App\Service\IriActorProvider
        arguments: ['@security.helper']

    App\Push\PushSenderInterface: '@App\Push\WebPushSender'

    App\Validator\PasswordPolicyValidator:
        arguments:
            $minStrength: '%app.password_min_strength%'

when@dev:
    parameters:
        # Local dev: don't make the engineer think up a 12-char password
        # every time fixtures rebuild. Backend still enforces 8-char min.
        app.password_min_strength: 0
        # Local dev defaults to open signups so the normal flow Just Works;
        # toggle waitlist on from /admin/waitlist to exercise the gate.
        app.waitlist_enabled_default: false

# In test the dispatcher must not open real sockets to FCM/Mozilla — alias
# the interface to an in-memory recorder the test suite can inspect and
# pre-arm with "expired" endpoints to exercise the prune-dead-rows path.
when@test:
    parameters:
        # Test fixtures use trivial passwords; the gate is unit-tested in
        # `PasswordPolicyValidatorTest` independent of this default.
        app.password_min_strength: 0
        # Default to open signups so the existing user/auth suite keeps
        # registering plain users; WaitlistTest flips the toggle on
        # explicitly to exercise the gated path.
        app.waitlist_enabled_default: false
    services:
        App\Tests\Push\InMemoryPushSender:
            public: true
        App\Push\PushSenderInterface: '@App\Tests\Push\InMemoryPushSender'
