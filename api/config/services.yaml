# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Doctrine\TaskOwnerExtension:
        tags:
            - { name: api_platform.doctrine.orm.query_extension.collection }
            - { name: api_platform.doctrine.orm.query_extension.item }

    App\Doctrine\TagOwnerExtension:
        tags:
            - { name: api_platform.doctrine.orm.query_extension.collection }
            - { name: api_platform.doctrine.orm.query_extension.item }

    App\Doctrine\ApiTokenAccessExtension:
        tags:
            - { name: api_platform.doctrine.orm.query_extension.collection }
            - { name: api_platform.doctrine.orm.query_extension.item }

    # MCP tool autoconfiguration: every class implementing McpToolInterface
    # is tagged so it lands in the tool registry without per-class wiring.
    _instanceof:
        App\Mcp\Tool\McpToolInterface:
            tags: ['app.mcp_tool']

    App\Mcp\McpToolRegistry:
        arguments:
            $tools: !tagged_iterator app.mcp_tool

    # Replace stof's default actor provider with one that yields the
    # user's IRI (`/users/{uuid}`) instead of `getUserIdentifier()`
    # (= email). The IRI is stable across email changes and lets the
    # activity controllers resolve the actor back to a User row.
    stof_doctrine_extensions.tool.actor_provider:
        class: App\Service\IriActorProvider
        arguments: ['@security.helper']

    App\Push\PushSenderInterface: '@App\Push\WebPushSender'

# In test the dispatcher must not open real sockets to FCM/Mozilla — alias
# the interface to an in-memory recorder the test suite can inspect and
# pre-arm with "expired" endpoints to exercise the prune-dead-rows path.
when@test:
    services:
        App\Tests\Push\InMemoryPushSender:
            public: true
        App\Push\PushSenderInterface: '@App\Tests\Push\InMemoryPushSender'
