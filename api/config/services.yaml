# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Default the calendar-webhook base URL to empty (webhooks off) when the
    # env var is unset — see app.calendar_webhook_base_url below (#582 Phase D).
    env(CALENDAR_WEBHOOK_BASE_URL): ''

    # Stripe self-serve price-id fallbacks. The billing controllers resolve each
    # price from its STRIPE_PRICE_* env var, defaulting to these params when the
    # env is empty/unset. Blank here → prod correctly reports "plan not
    # configured" until the real ids are set. Pinned in when@test below so the
    # billing suite is deterministic regardless of env-resolution order (see
    # RateLimitTest, which mutates $_ENV and reboots kernels).
    # List prices in minor units, used only to estimate MRR on the growth
    # dashboard (#763). Stripe remains the source of truth for actual revenue —
    # these ignore coupons, proration, and tax. Kept in step with
    # pwa/pages/pricing.tsx, which is what customers are actually quoted.
    # How long automation run rows are kept (#764). A debugging aid, not an
    # audit trail — every task edit on an automated board writes one.
    app.automation_run_retention_days: 30

    # AI agents (#827). The ledger stores tokens, which is what providers
    # actually bill in; `ai_credits_per_month` in PlanCatalog is what the
    # pricing page sells. This is the exchange rate between them, applied only
    # at the plan boundary and in the UI so rounding never accumulates across a
    # month of charges. 1 credit = 1k tokens puts Business (2000/mo) at ~2M
    # tokens, which is a working team's usage rather than a token gesture.
    app.ai_tokens_per_credit: 1000
    # Blank = this instance can't talk to a model at all, and every agent
    # reports itself unavailable rather than failing mid-conversation. Same
    # posture as the Stripe and VAPID keys.
    env(OPENAI_API_KEY): ''
    # Optional override for the provider's own default model.
    env(OPENAI_MODEL): ''

    app.plan_price_pro_monthly_cents: 1000
    app.plan_price_business_monthly_cents: 1500

    app.stripe_price_pro_monthly: ''
    app.stripe_price_pro_yearly: ''
    app.stripe_price_business_monthly: ''
    app.stripe_price_business_yearly: ''

    # Whether a new open signup (waitlist off) must confirm its email before
    # the account is usable. Env-driven (like the RATE_LIMIT_* knobs) so the
    # test suite can toggle it per case: prod/staging ship it ON via .env,
    # dev + test default it OFF (.env.dev / .env.test) so existing signups +
    # the suite register immediately-usable accounts. Read by
    # UserPasswordHasherProcessor; see App\Service\EmailVerificationService.
    env(EMAIL_VERIFICATION_REQUIRED): '1'
    app.email_verification_required: '%env(bool:EMAIL_VERIFICATION_REQUIRED)%'

    # Minimum `Symfony\Component\Validator\Constraints\PasswordStrength` score
    # required for signup, change-password, and reset-password. 0 =
    # VERY_WEAK, 2 = MEDIUM, 4 = VERY_STRONG. Staging + production stay at
    # MEDIUM; dev + test relax to VERY_WEAK (see `when@dev` / `when@test`).
    app.password_min_strength: 2

    # Default signup mode when no `app_setting` row has been written yet
    # (i.e. before any admin has touched the toggle). Ships ON so a fresh
    # prod/staging deploy is locked to the waitlist immediately; dev + test
    # relax to OFF so local signups + the test suite keep working. Once an
    # admin flips the toggle, the DB row wins over this default. Read by
    # App\Service\WaitlistSettings.
    app.waitlist_enabled_default: true

    # Backups (App\Service\BackupRunner): where app:backup:run writes its
    # dumps/archives, and how many of each kind to keep (newest first,
    # oldest deleted; 0 disables the cap). In the compose stack the dir is
    # bind-mounted to ./backups on the host so scripts/restore.sh and
    # off-box copy jobs work on plain files.
    app.backup_dir: '%kernel.project_dir%/var/backups'
    app.backup_max_backups: 5

    # Space data exports (App\Service\SpaceExportBuilder / SpaceExportPruner):
    # where the requested zip archives are written, and how many days a
    # finished export stays downloadable before the nightly prune deletes the
    # file and its row. The dir lives under var/ (NOT var/media) so the
    # archives are never reachable through the public /media/* Caddy route —
    # downloads go through the authenticated, token-gated endpoint only.
    app.space_export_dir: '%kernel.project_dir%/var/exports'
    app.space_export_retention_days: 7

    # Account (GDPR) data exports share the same on-disk conventions as space
    # exports — a zip under var/exports (filename-prefixed account-export-*),
    # gated behind the authenticated token endpoint, pruned after N days.
    app.account_export_dir: '%kernel.project_dir%/var/exports'
    app.account_export_retention_days: 7

    # Per-user usage tracking (App\Service\UsageSnapshotBuilder /
    # CaptureUsageSnapshotHandler). `row_overhead_bytes` is the fixed
    # per-row cost folded into the logical db-size estimate (fixed
    # columns + index entries the octet_length sum doesn't capture) — a
    # tunable knob, not a measurement. `counter_retention_days` is how
    # long live (user, day, metric) counter buckets are kept after their
    # day has been rolled into a snapshot.
    app.usage_db_row_overhead_bytes: 512
    app.usage_counter_retention_days: 90

    # Calendar sync webhooks (#582 Phase D, App\Service\CalendarSubscription
    # manager). The public base URL providers post change-notifications to —
    # subscriptions are only created when this is set, so calendar webhooks are
    # dark-launched (blank = off; poll-based two-way sync still works). In prod
    # this is the app's public https origin (e.g. https://madori.app); Google
    # additionally requires the domain be verified for push notifications.
    app.calendar_webhook_base_url: '%env(CALENDAR_WEBHOOK_BASE_URL)%'

    # Billing / freemium gate (App\Service\UsageLimiter). The paid "Team"
    # plan is per-seat, billed to a Space; a free shared space is capped on
    # both members and MCP throughput for its members, and an entitling
    # subscription lifts both. `billing_enforcement_enabled` ships OFF so the
    # gate can land + deploy dark before Stripe is live — flip it on at go-live
    # with the `BILLING_ENFORCEMENT_ENABLED` env (a prod-env knob, no code
    # deploy). Unset/blank keeps it off, so dev + test aren't gated; the limiter
    # is unit-tested by constructing it directly with enforcement on.
    app.free_mcp_daily_limit: 100
    app.free_space_member_limit: 5
    app.billing_enforcement_enabled: '%env(bool:default:app.billing_enforcement_enabled_default:BILLING_ENFORCEMENT_ENABLED)%'
    app.billing_enforcement_enabled_default: false

    # How long a deleted organization, space, or account stays restorable before
    # the nightly purge hard-deletes it. Deleting any of the three cascades to
    # everything inside it, so this window is what stands between one click and
    # the loss of other people's work — and it's the lifetime of the restore
    # link emailed at deletion time. One knob for all three deliberately: a
    # space that outlived its org's window (or vice versa) would be confusing to
    # explain and worse to reason about. Each record stores its own
    # `purge_after` at deletion time, so shortening this can never bring forward
    # a deletion someone was already promised.
    app.deletion_grace_days: '%env(int:default:app.deletion_grace_days_default:DELETION_GRACE_DAYS)%'
    app.deletion_grace_days_default: 30

    # Platform fee kept on each client invoice paid through a space's Stripe
    # Connect account, in basis points (100 = 1%). 0 = the platform takes no
    # cut. Env-overridable so the business rate is a deploy knob, not a release.
    app.stripe_connect_application_fee_bps: '%env(int:default:app.stripe_connect_application_fee_bps_default:STRIPE_CONNECT_FEE_BPS)%'
    app.stripe_connect_application_fee_bps_default: 0

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Doctrine\TaskOwnerExtension:
        tags:
            - { name: api_platform.doctrine.orm.query_extension.collection }
            - { name: api_platform.doctrine.orm.query_extension.item }

    App\Doctrine\TagAccessExtension:
        tags:
            - { name: api_platform.doctrine.orm.query_extension.collection }
            - { name: api_platform.doctrine.orm.query_extension.item }

    App\Doctrine\ApiTokenAccessExtension:
        tags:
            - { name: api_platform.doctrine.orm.query_extension.collection }
            - { name: api_platform.doctrine.orm.query_extension.item }

    # MCP tool + custom-field-type autoconfiguration: every class
    # implementing the respective interface is tagged so it lands in its
    # registry without per-class wiring. Adding a new MCP tool or a new
    # custom-field-type strategy is then a one-file change.
    _instanceof:
        App\Mcp\Tool\McpToolInterface:
            tags: ['app.mcp_tool']
        App\CustomField\Type\CustomFieldTypeInterface:
            tags: ['app.custom_field_type']
        App\CustomField\Converter\CustomFieldTypeConverterInterface:
            tags: ['app.custom_field_converter']
        App\Analytics\AnalyticsMetricInterface:
            tags: ['app.analytics_metric']
        App\Dashboard\WidgetDefinitionInterface:
            tags: ['app.dashboard_widget']
        App\Automation\TriggerDefinitionInterface:
            tags: ['app.automation_trigger']
        App\Automation\ConditionDefinitionInterface:
            tags: ['app.automation_condition']
        App\Automation\ActionDefinitionInterface:
            tags: ['app.automation_action']

    App\Growth\GrowthMetrics:
        arguments:
            $proMonthlyCents: '%app.plan_price_pro_monthly_cents%'
            $businessMonthlyCents: '%app.plan_price_business_monthly_cents%'

    App\Mcp\McpToolRegistry:
        arguments:
            $tools: !tagged_iterator app.mcp_tool

    App\CustomField\CustomFieldTypeRegistry:
        arguments:
            $types: !tagged_iterator app.custom_field_type

    App\CustomField\Converter\CustomFieldConverterRegistry:
        arguments:
            $converters: !tagged_iterator app.custom_field_converter

    # Database-backed session storage (wired via framework.session.handler_id)
    # so logins persist across container swaps / deploys. Uses a DEDICATED
    # PDO (see SessionPdoFactory) — sharing Doctrine's connection makes the
    # handler's row-lock transaction collide with the request's ORM
    # transaction. The `sessions` table is provisioned by a migration and
    # excluded from ORM schema management.
    session.pdo:
        class: PDO
        factory: ['App\Session\SessionPdoFactory', 'create']
        arguments: ['@doctrine.dbal.default_connection']

    Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler:
        arguments:
            - '@session.pdo'

    # Replace stof's default actor provider with one that yields the
    # user's IRI (`/users/{uuid}`) instead of `getUserIdentifier()`
    # (= email). The IRI is stable across email changes and lets the
    # activity controllers resolve the actor back to a User row.
    stof_doctrine_extensions.tool.actor_provider:
        class: App\Service\IriActorProvider
        arguments: ['@security.helper']

    App\Push\PushSenderInterface: '@App\Push\WebPushSender'

    # Billing gateway: the real Stripe-over-HttpClient implementation in
    # prod/dev; the test suite swaps in an in-memory recorder (see when@test).
    App\Billing\StripeGatewayInterface: '@App\Billing\StripeGateway'

    # Calendar sync (#582): real provider clients over HttpClient in prod/dev;
    # the test suite swaps in an in-memory recorder (see when@test). The
    # registry routes by provider so the handler + puller stay provider-agnostic.
    App\Calendar\CalendarClientInterface: '@App\Calendar\GoogleCalendarClient'
    App\Calendar\CalendarClientRegistry:
        arguments:
            $clients:
                google: '@App\Calendar\GoogleCalendarClient'
                microsoft: '@App\Calendar\MicrosoftCalendarClient'
    App\Service\CalendarSubscriptionManager:
        arguments:
            $webhookBaseUrl: '%app.calendar_webhook_base_url%'

    # AI model providers (#827): the real OpenAI-over-HttpClient implementation
    # in prod/dev; the suite swaps in an in-memory double (see when@test), which
    # is what keeps the test run off a paid API. The registry routes by name so
    # AgentChatService never names an implementation — a second model is one
    # class plus one line here.
    App\Ai\ChatProviderRegistry:
        arguments:
            $providers:
                openai: '@App\Ai\OpenAiChatProvider'

    App\Validator\PasswordPolicyValidator:
        arguments:
            $minStrength: '%app.password_min_strength%'

    # Freemium gate read-side. Caps + the dark-launch flag are bound from
    # parameters so prod can size them independently of dev/test.
    App\Service\UsageLimiter:
        arguments:
            $freeMcpDailyLimit: '%app.free_mcp_daily_limit%'
            $freeSpaceMemberLimit: '%app.free_space_member_limit%'
            $enforcementEnabled: '%app.billing_enforcement_enabled%'

    # Login throttling for the `main` firewall (security.yaml
    # `login_throttling.limiter`). Same shape as Symfony's built-in default
    # — a per-(IP, email) limit plus a wider per-IP net — but wired to the
    # env-tunable limiters declared in framework.yaml instead of the
    # built-in hardcoded `max_attempts` / `5 * max_attempts` pair, so
    # prod/dev/test can size them independently. Keys are HMAC-hashed with
    # the kernel secret inside DefaultLoginRateLimiter; the limiter is
    # peekable, so only *failed* attempts consume the budget.
    app.login_rate_limiter:
        class: Symfony\Component\Security\Http\RateLimiter\DefaultLoginRateLimiter
        arguments:
            $globalFactory: '@limiter.login_ip'
            $localFactory: '@limiter.login_ip_email'
            $secret: '%kernel.secret%'

    # Sentry Structured Logs bridge: a Monolog handler that forwards records to
    # Sentry's Logs product (needs sentry.options.enable_logs). Registered as an
    # *extra* Monolog handler in monolog.yaml (when@prod), so app logs keep going
    # to stderr AND fan out to Sentry — Monolog already multiplexes to every
    # handler, so this is the "composite" without a custom logger. info+ only, to
    # respect the free-tier logs quota; records whose context carries an
    # exception are skipped (they're reported as issues). Inert without a DSN.
    Sentry\SentryBundle\Monolog\LogsHandler:
        arguments:
            $level: 'info'
            $bubble: true

when@dev:
    parameters:
        # Local dev: don't make the engineer think up a 12-char password
        # every time fixtures rebuild. Backend still enforces 8-char min.
        app.password_min_strength: 0
        # Local dev defaults to open signups so the normal flow Just Works;
        # toggle waitlist on from /admin/waitlist to exercise the gate.
        app.waitlist_enabled_default: false

# In test the dispatcher must not open real sockets to FCM/Mozilla — alias
# the interface to an in-memory recorder the test suite can inspect and
# pre-arm with "expired" endpoints to exercise the prune-dead-rows path.
when@test:
    parameters:
        # Test fixtures use trivial passwords; the gate is unit-tested in
        # `PasswordPolicyValidatorTest` independent of this default.
        app.password_min_strength: 0
        # Default to open signups so the existing user/auth suite keeps
        # registering plain users; WaitlistTest flips the toggle on
        # explicitly to exercise the gated path.
        app.waitlist_enabled_default: false
        # Pin the Stripe price ids so the billing suite always sees the plans as
        # configured — the STRIPE_PRICE_* env in .env.test can resolve empty in
        # an unlucky test order (RateLimitTest mutates $_ENV + reboots kernels),
        # which intermittently 503'd checkout with "plan not configured". These
        # match the .env.test values so assertions on the price id still hold.
        app.stripe_price_pro_monthly: 'price_test_pro_monthly'
        app.stripe_price_pro_yearly: 'price_test_pro_yearly'
        app.stripe_price_business_monthly: 'price_test_biz_monthly'
        app.stripe_price_business_yearly: 'price_test_biz_yearly'
    services:
        # The automation runner has one consumer in prod (the message handler),
        # so the container inlines it and the test container can't fetch it.
        # Public here lets AutomationRunnerTest drive the executor directly,
        # which is the only way to assert per-step outcomes.
        # Scheduler handlers have no consumer other than the bus, so the
        # container inlines them and the test container can't fetch them.
        App\MessageHandler\SweepDueTasksHandler:
            public: true
            autowire: true
        App\MessageHandler\PruneAutomationRunsHandler:
            public: true
            autowire: true

        App\Automation\AutomationRunner:
            public: true
            # This block has no _defaults, so autowiring has to be restated —
            # without it the definition is bare and the constructor gets nothing.
            autowire: true

        App\Tests\Push\InMemoryPushSender:
            public: true
        App\Push\PushSenderInterface: '@App\Tests\Push\InMemoryPushSender'
        # Billing: never hit Stripe in tests — record calls in memory and
        # accept a fixed webhook signature. Public so tests can fetch + inspect.
        App\Tests\Billing\InMemoryStripeGateway:
            public: true
        App\Billing\StripeGatewayInterface: '@App\Tests\Billing\InMemoryStripeGateway'
        # Calendar sync: never call a provider in tests — record pushes in
        # memory so the sync handler + puller run end-to-end. One recorder backs
        # every provider so multi-provider fan-out is exercised. Public so tests
        # can inspect it.
        App\Tests\Calendar\InMemoryCalendarClient:
            public: true
        App\Calendar\CalendarClientInterface: '@App\Tests\Calendar\InMemoryCalendarClient'
        App\Calendar\CalendarClientRegistry:
            arguments:
                $clients:
                    google: '@App\Tests\Calendar\InMemoryCalendarClient'
                    microsoft: '@App\Tests\Calendar\InMemoryCalendarClient'
        # AI: never call a model in tests. The double reports itself configured
        # so the metering path runs end-to-end, and lets a test dictate exactly
        # what a call "cost". Public so tests can fetch + drive it.
        App\Tests\Ai\InMemoryChatProvider:
            public: true
        App\Ai\ChatProviderRegistry:
            arguments:
                $providers:
                    openai: '@App\Tests\Ai\InMemoryChatProvider'
        # Each has a single prod consumer, so the container inlines it and the
        # test container can't fetch it. The credit tests drive both directly —
        # asserting the reserve/settle ordering is only possible from inside.
        App\Service\AgentChatService:
            public: true
        App\Service\AiCreditMeter:
            public: true
