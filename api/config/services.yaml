# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Minimum `Symfony\Component\Validator\Constraints\PasswordStrength` score
    # required for signup, change-password, and reset-password. 0 =
    # VERY_WEAK, 2 = MEDIUM, 4 = VERY_STRONG. Staging + production stay at
    # MEDIUM; dev + test relax to VERY_WEAK (see `when@dev` / `when@test`).
    app.password_min_strength: 2

    # Default signup mode when no `app_setting` row has been written yet
    # (i.e. before any admin has touched the toggle). Ships ON so a fresh
    # prod/staging deploy is locked to the waitlist immediately; dev + test
    # relax to OFF so local signups + the test suite keep working. Once an
    # admin flips the toggle, the DB row wins over this default. Read by
    # App\Service\WaitlistSettings.
    app.waitlist_enabled_default: true

    # Backups (App\Service\BackupRunner): where app:backup:run writes its
    # dumps/archives, and how many of each kind to keep (newest first,
    # oldest deleted; 0 disables the cap). In the compose stack the dir is
    # bind-mounted to ./backups on the host so scripts/restore.sh and
    # off-box copy jobs work on plain files.
    app.backup_dir: '%kernel.project_dir%/var/backups'
    app.backup_max_backups: 5

    # Space data exports (App\Service\SpaceExportBuilder / SpaceExportPruner):
    # where the requested zip archives are written, and how many days a
    # finished export stays downloadable before the nightly prune deletes the
    # file and its row. The dir lives under var/ (NOT var/media) so the
    # archives are never reachable through the public /media/* Caddy route —
    # downloads go through the authenticated, token-gated endpoint only.
    app.space_export_dir: '%kernel.project_dir%/var/exports'
    app.space_export_retention_days: 7

    # Account (GDPR) data exports share the same on-disk conventions as space
    # exports — a zip under var/exports (filename-prefixed account-export-*),
    # gated behind the authenticated token endpoint, pruned after N days.
    app.account_export_dir: '%kernel.project_dir%/var/exports'
    app.account_export_retention_days: 7

    # Per-user usage tracking (App\Service\UsageSnapshotBuilder /
    # CaptureUsageSnapshotHandler). `row_overhead_bytes` is the fixed
    # per-row cost folded into the logical db-size estimate (fixed
    # columns + index entries the octet_length sum doesn't capture) — a
    # tunable knob, not a measurement. `counter_retention_days` is how
    # long live (user, day, metric) counter buckets are kept after their
    # day has been rolled into a snapshot.
    app.usage_db_row_overhead_bytes: 512
    app.usage_counter_retention_days: 90

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Doctrine\TaskOwnerExtension:
        tags:
            - { name: api_platform.doctrine.orm.query_extension.collection }
            - { name: api_platform.doctrine.orm.query_extension.item }

    App\Doctrine\TagOwnerExtension:
        tags:
            - { name: api_platform.doctrine.orm.query_extension.collection }
            - { name: api_platform.doctrine.orm.query_extension.item }

    App\Doctrine\ApiTokenAccessExtension:
        tags:
            - { name: api_platform.doctrine.orm.query_extension.collection }
            - { name: api_platform.doctrine.orm.query_extension.item }

    # MCP tool + custom-field-type autoconfiguration: every class
    # implementing the respective interface is tagged so it lands in its
    # registry without per-class wiring. Adding a new MCP tool or a new
    # custom-field-type strategy is then a one-file change.
    _instanceof:
        App\Mcp\Tool\McpToolInterface:
            tags: ['app.mcp_tool']
        App\CustomField\Type\CustomFieldTypeInterface:
            tags: ['app.custom_field_type']

    App\Mcp\McpToolRegistry:
        arguments:
            $tools: !tagged_iterator app.mcp_tool

    App\CustomField\CustomFieldTypeRegistry:
        arguments:
            $types: !tagged_iterator app.custom_field_type

    # Replace stof's default actor provider with one that yields the
    # user's IRI (`/users/{uuid}`) instead of `getUserIdentifier()`
    # (= email). The IRI is stable across email changes and lets the
    # activity controllers resolve the actor back to a User row.
    stof_doctrine_extensions.tool.actor_provider:
        class: App\Service\IriActorProvider
        arguments: ['@security.helper']

    App\Push\PushSenderInterface: '@App\Push\WebPushSender'

    App\Validator\PasswordPolicyValidator:
        arguments:
            $minStrength: '%app.password_min_strength%'

    # Login throttling for the `main` firewall (security.yaml
    # `login_throttling.limiter`). Same shape as Symfony's built-in default
    # — a per-(IP, email) limit plus a wider per-IP net — but wired to the
    # env-tunable limiters declared in framework.yaml instead of the
    # built-in hardcoded `max_attempts` / `5 * max_attempts` pair, so
    # prod/dev/test can size them independently. Keys are HMAC-hashed with
    # the kernel secret inside DefaultLoginRateLimiter; the limiter is
    # peekable, so only *failed* attempts consume the budget.
    app.login_rate_limiter:
        class: Symfony\Component\Security\Http\RateLimiter\DefaultLoginRateLimiter
        arguments:
            $globalFactory: '@limiter.login_ip'
            $localFactory: '@limiter.login_ip_email'
            $secret: '%kernel.secret%'

when@dev:
    parameters:
        # Local dev: don't make the engineer think up a 12-char password
        # every time fixtures rebuild. Backend still enforces 8-char min.
        app.password_min_strength: 0
        # Local dev defaults to open signups so the normal flow Just Works;
        # toggle waitlist on from /admin/waitlist to exercise the gate.
        app.waitlist_enabled_default: false

# In test the dispatcher must not open real sockets to FCM/Mozilla — alias
# the interface to an in-memory recorder the test suite can inspect and
# pre-arm with "expired" endpoints to exercise the prune-dead-rows path.
when@test:
    parameters:
        # Test fixtures use trivial passwords; the gate is unit-tested in
        # `PasswordPolicyValidatorTest` independent of this default.
        app.password_min_strength: 0
        # Default to open signups so the existing user/auth suite keeps
        # registering plain users; WaitlistTest flips the toggle on
        # explicitly to exercise the gated path.
        app.waitlist_enabled_default: false
    services:
        App\Tests\Push\InMemoryPushSender:
            public: true
        App\Push\PushSenderInterface: '@App\Tests\Push\InMemoryPushSender'
