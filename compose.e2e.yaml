# E2E override: dev API (fixtures + bin/console available), prod PWA build.
#
# Used in place of compose.override.yaml for E2E runs. `next dev` compiles
# routes on first hit, which races Playwright's URL assertions under load;
# the standalone prod build serves pre-compiled routes and removes that
# class of flake entirely (and is meaningfully faster end-to-end).
services:
  php:
    build:
      context: ./api
      target: frankenphp_dev
    volumes:
      - ./api:/app
      - /app/var
      - api_vendor:/app/vendor
      - ./api/frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./api/frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
    environment:
      FRANKENPHP_WORKER_CONFIG: watch
      MERCURE_EXTRA_DIRECTIVES: demo
      XDEBUG_MODE: "off"
    extra_hosts:
      - host.docker.internal:host-gateway
    tty: true

  # The worker (defined in compose.yaml) reuses the dev php image, which has
  # no source baked in — give it the same source + vendor mounts as php here
  # (compose.e2e.yaml replaces compose.override.yaml, which carries them for
  # normal dev). Without this the worker boots an empty /app and crashes.
  worker:
    volumes:
      - ./api:/app
      - /app/var
      - api_vendor:/app/vendor
    environment:
      XDEBUG_MODE: "off"

  pwa:
    # Distinct image name from the dev-target `app-pwa` so both can be
    # baked, saved, and loaded side-by-side in a single CI artifact.
    image: ${IMAGES_PREFIX:-}app-pwa-prod
    build:
      context: ./pwa
      target: prod

###> doctrine/doctrine-bundle ###
  database:
    ports:
      - target: 5432
        published: ${POSTGRES_PORT:-5432}
        protocol: tcp
###< doctrine/doctrine-bundle ###

volumes:
  api_vendor:
