# Development environment override
services:
  php:
    build:
      context: ./api
      target: frankenphp_dev
    volumes:
      - ./api:/app
      - /app/var
      # Keep vendor/ inside the container instead of the host bind-mount.
      # Required on Windows/macOS — pnpm/composer's symlink-heavy installs
      # corrupt the WSL or osxfs share when written through a bind-mount.
      # Named (vs. anonymous) so it persists across `compose run --rm`.
      - api_vendor:/app/vendor
      - ./api/frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./api/frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
    environment:
      FRANKENPHP_WORKER_CONFIG: watch
      MERCURE_EXTRA_DIRECTIVES: demo
      # See https://xdebug.org/docs/all_settings#mode
      XDEBUG_MODE: "${XDEBUG_MODE:-off}"
    extra_hosts:
      # Ensure that host.docker.internal is correctly defined on Linux
      - host.docker.internal:host-gateway
    tty: true

  # Job runner shares the dev image + source bind-mount + vendor volume so
  # it runs the same code the php service does (the dev image has no source
  # baked in — it lives in the bind-mount).
  worker:
    volumes:
      - ./api:/app
      - /app/var
      - api_vendor:/app/vendor
    environment:
      XDEBUG_MODE: "off"

  # Static-analysis tools run against the dev `app-php` image (built by
  # the existing `php` service) so they inherit the same PHP extensions
  # the app needs at runtime (pdo_pgsql, intl, gd) — phpstan-doctrine's
  # objectManagerLoader boots a real `test` kernel and needs them. Shares
  # the `api_vendor` volume so the same composer install is reused.
  # `profiles: ["tools"]` keeps these out of normal `docker compose up`.
  phpstan:
    image: app-php
    profiles: ["tools"]
    working_dir: /app
    mem_limit: 8g
    volumes:
      - ./api:/app
      - api_vendor:/app/vendor
    environment:
      APP_ENV: test
      XDEBUG_MODE: "off"
    entrypoint: ["php", "-d", "xdebug.mode=off", "vendor/bin/phpstan"]
    command: ["analyse", "--memory-limit=4G"]

  phpcs:
    image: app-php
    profiles: ["tools"]
    working_dir: /app
    volumes:
      - ./api:/app
      - api_vendor:/app/vendor
    environment:
      XDEBUG_MODE: "off"
    entrypoint: ["php", "-d", "xdebug.mode=off", "vendor/bin/phpcs"]

  pwa:
    build:
      context: ./pwa
      target: dev
    volumes:
      - ./pwa:/srv/app
      # See note on `/app/vendor` above — keeps pnpm's symlinked store
      # off the host filesystem so installs don't corrupt the WSL share.
      - pwa_node_modules:/srv/app/node_modules
      # Repo-root docs/ surfaced inside the container so scripts/sync-docs.mjs
      # can find a source when predev / prebuild runs from /srv/app.
      - ./docs:/srv/docs:ro
    environment:
      API_PLATFORM_CREATE_CLIENT_ENTRYPOINT: http://php
      API_PLATFORM_CREATE_CLIENT_OUTPUT: .
      # On Linux, you may want to comment the following line for improved performance
      WATCHPACK_POLLING: "true"

###> doctrine/doctrine-bundle ###
  database:
    ports:
      - target: 5432
        published: ${POSTGRES_PORT:-5432}
        protocol: tcp
###< doctrine/doctrine-bundle ###

###> symfony/mercure-bundle ###
###< symfony/mercure-bundle ###

volumes:
  api_vendor:
  pwa_node_modules:
