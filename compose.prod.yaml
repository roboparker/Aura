# Production environment override
services:
  php:
    build:
      context: ./api
      target: frankenphp_prod
    environment:
      APP_SECRET: ${APP_SECRET}
      MERCURE_PUBLISHER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET}

  # Reuses the prod php image (source + vendor baked in, no bind-mount).
  worker:
    environment:
      APP_SECRET: ${APP_SECRET}

  pwa:
    build:
      context: ./pwa
      target: prod

  database:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  # Hard-require the Umami secret in prod (no insecure default). The
  # dashboard is public at UMAMI_SERVER_NAME (set analytics.<domain> in the
  # server's .env — see the Caddyfile site block); the loopback-bound port
  # (compose.yaml) remains as an SSH-tunnel fallback:
  # ssh -L 3001:localhost:3001 <server>.
  umami:
    environment:
      APP_SECRET: ${UMAMI_APP_SECRET}
