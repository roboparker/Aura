# Production environment override
services:
  php:
    build:
      context: ./api
      target: frankenphp_prod
    environment:
      APP_SECRET: ${APP_SECRET}
      MERCURE_PUBLISHER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET}

  # Reuses the prod php image (source + vendor baked in, no bind-mount).
  worker:
    environment:
      APP_SECRET: ${APP_SECRET}

  pwa:
    build:
      context: ./pwa
      target: prod

  database:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  # Hard-require the Umami secret in prod (no insecure default). The
  # dashboard port stays loopback-bound (see compose.yaml) — reach it via
  # an SSH tunnel: ssh -L 3001:localhost:3001 <server>.
  umami:
    environment:
      APP_SECRET: ${UMAMI_APP_SECRET}
